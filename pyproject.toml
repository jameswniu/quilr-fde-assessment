[project]
name = "quilr-fde-assessment"
version = "0.1.0"
description = "Forward Deployed Engineer assessment: MCP server, MCP security gateway, streaming PII guardrail, model router."
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.27.1,<2",
    "pydantic>=2.13.4,<3",
    "starlette>=0.51.0,<1",
    "uvicorn>=0.41.0,<1",
    "httpx>=0.28.1,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
    "pytest-asyncio>=1.3.0,<2",
    "ruff>=0.14.0,<1",
    "mypy>=1.18.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/task1_mcp_server",
    "src/task2_mcp_gateway",
    "src/task3_stream_guard",
    "src/task4_model_router",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true
