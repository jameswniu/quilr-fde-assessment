<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Four tasks from the Quilr FDE brief, an MCP server, a security gateway, a streaming PII guardrail and a model router">
<rect x="0" y="0" width="1200" height="420" fill="#0a0a0a"/>
<text x="48" y="46" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" fill="#d4d4d8" text-anchor="start" letter-spacing="3">FOUR TASKS / ONE SUITE / NO NETWORK</text>
<text x="48" y="98" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#ffffff" text-anchor="start">Four tasks from the FDE brief</text>
<rect x="0" y="126" width="64" height="4" fill="#ffffff"/>
<text x="48" y="166" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#a1a1aa" text-anchor="start">MCP server, security gateway, streaming PII guardrail, model router.</text>
<rect x="48" y="196" width="355" height="96" rx="12" fill="#1c1c20" stroke="#52525b" stroke-width="1.5"/>
