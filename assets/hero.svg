<text x="300" y="343" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" fill="#ffffff" text-anchor="middle">gateway</text>
<rect x="380" y="316" width="198" height="40" rx="2" fill="#1b5e3f"/>
<text x="479" y="343" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" fill="#ffffff" text-anchor="middle">stream guard</text>
