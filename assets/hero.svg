<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Where does a bad request stop? Four tasks from the FDE brief, each a gate with one refusal to prove. The schema gate asks whether the arguments fit the schema and refuses with -32602. The role gate asks whether this role may call this tool and refuses with -32001 before anything is forwarded. The hold gate asks whether this text can still change and holds it, 640 characters at most. The budget gate asks whether there is budget and whether the primary is up, refuses with rate_limited, and fails over on a 429 or 3000 ms.">
<rect x="0" y="0" width="1200" height="460" fill="#141413"/>
<rect x="0" y="0" width="1200" height="4" fill="#CC785C"/>
<text x="48" y="50" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" font-weight="400" fill="#B8B0A4" text-anchor="start" letter-spacing="3">FOUR TASKS / FOUR GATES / ONE SUITE, NO NETWORK</text>
<text x="48" y="102" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#F4F1EA" text-anchor="start">Where does a bad request stop?</text>
<text x="48" y="142" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#B8B0A4" text-anchor="start">Four tasks from the FDE brief, each a gate with one refusal to prove.</text>
<rect x="48" y="168" width="264" height="232" rx="10" fill="#1F1E1D" stroke="#3A3734" stroke-width="1.5"/>
<rect x="48" y="168" width="6" height="232" rx="3" fill="#CC785C"/>
<text x="70" y="208" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" font-weight="700" fill="#CC785C" text-anchor="start" letter-spacing="2">01 SCHEMA</text>
<text x="70" y="250" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F1EA" text-anchor="start">Do the arguments</text>
<text x="70" y="280" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F1EA" text-anchor="start">fit the schema?</text>
<text x="70" y="320" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" font-weight="400" fill="#B8B0A4" text-anchor="start" letter-spacing="1.5">WHEN IT SAYS NO</text>
<text x="70" y="354" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#F4F1EA" text-anchor="start">-32602</text>
<text x="70" y="384" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" font-weight="400" fill="#B8B0A4" text-anchor="start">Invalid params</text>
<rect x="328" y="168" width="264" height="232" rx="10" fill="#1F1E1D" stroke="#3A3734" stroke-width="1.5"/>
<rect x="328" y="168" width="6" height="232" rx="3" fill="#CC785C"/>
<text x="350" y="208" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" font-weight="700" fill="#CC785C" text-anchor="start" letter-spacing="2">02 ROLE</text>
<text x="350" y="250" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F1EA" text-anchor="start">May this role</text>
<text x="350" y="280" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F1EA" text-anchor="start">call this tool?</text>
<text x="350" y="320" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" font-weight="400" fill="#B8B0A4" text-anchor="start" letter-spacing="1.5">WHEN IT SAYS NO</text>
<text x="350" y="354" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#F4F1EA" text-anchor="start">-32001</text>
<text x="350" y="384" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" font-weight="400" fill="#B8B0A4" text-anchor="start">not forwarded</text>
<rect x="608" y="168" width="264" height="232" rx="10" fill="#1F1E1D" stroke="#3A3734" stroke-width="1.5"/>
<rect x="608" y="168" width="6" height="232" rx="3" fill="#CC785C"/>
<text x="630" y="208" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" font-weight="700" fill="#CC785C" text-anchor="start" letter-spacing="2">03 HOLD</text>
<text x="630" y="250" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F1EA" text-anchor="start">Can this text</text>
<text x="630" y="280" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F1EA" text-anchor="start">still change?</text>
<text x="630" y="320" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" font-weight="400" fill="#B8B0A4" text-anchor="start" letter-spacing="1.5">WHEN IT SAYS NO</text>
<text x="630" y="354" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#F4F1EA" text-anchor="start">holds the tail</text>
<text x="630" y="384" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" font-weight="400" fill="#B8B0A4" text-anchor="start">640 char ceiling</text>
<rect x="888" y="168" width="264" height="232" rx="10" fill="#1F1E1D" stroke="#3A3734" stroke-width="1.5"/>
<rect x="888" y="168" width="6" height="232" rx="3" fill="#CC785C"/>
<text x="910" y="208" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" font-weight="700" fill="#CC785C" text-anchor="start" letter-spacing="2">04 BUDGET</text>
<text x="910" y="250" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F1EA" text-anchor="start">Is there budget,</text>
<text x="910" y="280" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F1EA" text-anchor="start">is primary up?</text>
<text x="910" y="320" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" font-weight="400" fill="#B8B0A4" text-anchor="start" letter-spacing="1.5">WHEN IT SAYS NO</text>
<text x="910" y="354" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#F4F1EA" text-anchor="start">rate_limited</text>
<text x="910" y="384" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" font-weight="400" fill="#B8B0A4" text-anchor="start">429 or 3000 ms</text>
<text x="48" y="440" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" font-weight="400" fill="#B8B0A4" text-anchor="start">make bench measures, make figures redraws, make claims rereads the page</text>
</svg>
