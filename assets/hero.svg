<text x="70" y="268" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start">no coverage measured</text>
<rect x="418" y="196" width="355" height="96" rx="12" fill="#1c1c20" stroke="#52525b" stroke-width="1.5"/>
<rect x="418" y="196" width="6" height="96" rx="3" fill="#ffffff"/>
<text x="440" y="234" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="start">583 ms worst case</text>
<text x="440" y="268" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start">under 1 ms on safe prose</text>
<rect x="788" y="196" width="355" height="96" rx="12" fill="#1c1c20" stroke="#52525b" stroke-width="1.5"/>
<rect x="788" y="196" width="6" height="96" rx="3" fill="#ffffff"/>
<text x="810" y="234" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#ffffff" text-anchor="start">640 char ceiling</text>
<text x="810" y="268" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#a1a1aa" text-anchor="start">derived bound, 636 seen</text>
<rect x="48" y="316" width="172" height="40" rx="2" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="134" y="343" font-family="SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="22" fill="#ffffff" text-anchor="middle">mcp server</text>
